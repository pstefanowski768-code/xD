<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backrooms: Zniszczone korytarze</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="mode-picker">
        <div class="mode-panel">
            <h1>WYBIERZ SPOSÓB GRY</h1>
            <button class="mode-button" id="pc-mode">KOMPUTER — KLAWIATURA</button>
            <button class="mode-button" id="mobile-mode">TELEFON — DOTYK</button>
        </div>
    </div>
    <div id="loading">Generowanie zniszczonych korytarzy...</div>
    <div id="elevator-overlay"><span id="elevator-message">PRZEJAZD</span></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <p id="floor-label">Piętro 1</p>
        <div id="desktop-controls">
            <p>Strzałka <span class="key">↑</span> - krok naprzód</p>
            <p>Strzałki <span class="key">←</span><span class="key">→</span> - obrót o 90°</p>
            <p><span class="key">E</span> - otwieranie windy</p>
        </div>
        <div id="mobile-controls">
            <button class="mobile-button" data-action="left" aria-label="Obrót w lewo">←</button>
            <button class="mobile-button forward" data-action="forward" aria-label="Krok naprzód">↑</button>
            <button class="mobile-button" data-action="right" aria-label="Obrót w prawo">→</button>
            <button class="mobile-button" data-action="elevator" aria-label="Otwórz windę">E</button>
        </div>
        <p id="interaction-hint">Szukaj działającej windy.</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
