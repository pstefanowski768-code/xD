<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Dark Maze 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            pointer-events: none;
            user-select: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .key {
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            padding: 2px 8px;
            margin: 0 4px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
        }

        #loading {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
    </style>
    <!-- Using Three.js r128 via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="loading">Generowanie świata...</div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <p>Strzałka <span class="key">↑</span> - Krok naprzód</p>
        <p>Strzałki <span class="key">←</span> <span class="key">→</span> - Obrót o 90°</p>
    </div>

    <script>
        // Zmienne globalne silnika
        let scene, camera, renderer;
        let wallInstancedMesh, floorInstancedMesh, ceilInstancedMesh;
        let grimeInstancedMesh, puddleInstancedMesh;
        let ceilingLights = [];
        let elevators = [];
        let elevatorUsed = false;
        let elevatorBusy = false;
        
        // Zmienne gracza i ruchu
        const BLOCK_SIZE = 2; // Wielkość jednego bloku/pola
        let gridX = 0;
        let gridZ = 0;
        let currentYaw = 0; // W radianach
        
        // Stany animacji (tweening)
        let isMoving = false;
        let isRotating = false;
        let targetX = 0;
        let targetZ = 0;
        let targetYaw = 0;
        
        // Zasięg renderowania (chunk radius)
        const RENDER_RADIUS = 12; // widoczność na RENDER_RADIUS bloków w każdym kierunku
        const MAX_INSTANCES = (RENDER_RADIUS * 2 + 1) * (RENDER_RADIUS * 2 + 1);
        const MAX_DECOR_INSTANCES = MAX_INSTANCES * 2;

        // Funkcje pomocnicze dla matematyki i losowości
        function mod(n, m) { 
            return ((n % m) + m) % m; 
        }

        function pseudoRandom(x, z) {
            let n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453123;
            return n - Math.floor(n);
        }

        // Generator proceduralny nieskończonego labiryntu
        // 0 = wolne pole, 1 = ściana
        function getCell(x, z) {
            if (x === 0 && z === 0) return 0; // Zawsze wolne na start
            if (x === 0 && z === -1) return 0; // Zawsze wolne pole przed startem

            let isEvX = mod(x, 2) === 0;
            let isEvZ = mod(z, 2) === 0;

            if (isEvX && isEvZ) return 1; // Filary (krzyżówki siatki parzystej)
            if (!isEvX && !isEvZ) return 0; // Środki pomieszczeń/korytarzy

            // Krawędzie między filarami - generowanie ścian z prawdopodobieństwem 40%
            // Zapewnia to rozległy, połączony i skomplikowany labirynt bez zamkniętych stref.
            return pseudoRandom(x, z) < 0.4 ? 1 : 0; 
        }

        function createDirtTexture(baseHex, noiseHex1, noiseHex2, isFloor = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Baza
            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, 512, 512);

            // Dodawanie szumu proceduralnego (zabrudzenia, zarysowania)
            for (let i = 0; i < 30000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? noiseHex1 : noiseHex2;
                let x = Math.random() * 512;
                let y = Math.random() * 512;
                let w = Math.random() * 3;
                let h = Math.random() * 3;
                ctx.fillRect(x, y, w, h);
            }

            // Większe plamy i zacieki
            for (let i = 0; i < 60; i++) {
                ctx.fillStyle = `rgba(10, 10, 10, ${Math.random() * 0.4})`;
                ctx.beginPath();
                ctx.arc(
                    Math.random() * 512, 
                    Math.random() * 512, 
                    Math.random() * (isFloor ? 40 : 80), 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
            }
            
            // Lekka siatka kafelków dla podłogi i sufitu
            if (isFloor) {
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 4;
                ctx.strokeRect(0, 0, 512, 512);
            }

            const texture = new THREE.CanvasTexture(canvas);
            // Zapobieganie rozmyciu, nadanie ostrego "surowego" wyglądu
            texture.magFilter = THREE.LinearFilter; 
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            return texture;
        }


        // --- Dekoracje: kałuże, zabrudzenia i zacieki ---
        function createGrimeTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, 256, 256);
            for (let i = 0; i < 900; i++) {
                const x = Math.random() * 256, y = Math.random() * 256;
                const r = 1 + Math.random() * 12;
                ctx.fillStyle = `rgba(${10 + Math.random()*20}, ${35 + Math.random()*35}, ${15 + Math.random()*25}, ${0.08 + Math.random()*0.20})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(c);
        }

        function createPuddleTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, 256, 256);
            for (let i = 0; i < 18; i++) {
                ctx.fillStyle = `rgba(${10 + Math.random()*15}, ${18 + Math.random()*20}, ${18 + Math.random()*20}, ${0.15 + Math.random()*0.22})`;
                ctx.beginPath();
                ctx.ellipse(128 + (Math.random()-0.5)*70, 128 + (Math.random()-0.5)*70,
                    18 + Math.random()*65, 8 + Math.random()*28, Math.random()*Math.PI, 0, Math.PI*2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(c);
        }

        function addSurfaceDecorations() {
            const grimeGeo = new THREE.PlaneGeometry(BLOCK_SIZE * 0.9, BLOCK_SIZE * 0.9);
            grimeGeo.rotateX(-Math.PI / 2);
            const grimeMat = new THREE.MeshStandardMaterial({
                map: createGrimeTexture(), transparent: true, depthWrite: false,
                roughness: 1, side: THREE.DoubleSide
            });
            grimeInstancedMesh = new THREE.InstancedMesh(grimeGeo, grimeMat, MAX_DECOR_INSTANCES);

            const puddleGeo = new THREE.PlaneGeometry(BLOCK_SIZE * 0.9, BLOCK_SIZE * 0.65);
            puddleGeo.rotateX(-Math.PI / 2);
            const puddleMat = new THREE.MeshStandardMaterial({
                map: createPuddleTexture(), transparent: true, depthWrite: false,
                roughness: 0.18, metalness: 0.05, side: THREE.DoubleSide
            });
            puddleInstancedMesh = new THREE.InstancedMesh(puddleGeo, puddleMat, MAX_DECOR_INSTANCES);

            scene.add(grimeInstancedMesh);
            scene.add(puddleInstancedMesh);
        }

        // --- Winda ---
        function createElevatorAt(x, z) {
            const group = new THREE.Group();
            group.userData.gridX = x;
            group.userData.gridZ = z;
            group.userData.used = false;

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x252525, roughness: 0.85, metalness: 0.15 });
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 0.9 });
            const lampMat = new THREE.MeshStandardMaterial({ color: 0x77735f, emissive: 0x332f20, emissiveIntensity: 0.6 });

            const frame = new THREE.Mesh(new THREE.BoxGeometry(1.75, 1.9, 0.18), frameMat);
            frame.position.set(0, -0.05, -0.88);
            group.add(frame);

            const leftDoor = new THREE.Mesh(new THREE.BoxGeometry(0.82, 1.75, 0.08), doorMat);
            const rightDoor = leftDoor.clone();
            leftDoor.position.set(-0.43, -0.08, -0.79);
            rightDoor.position.set(0.43, -0.08, -0.79);
            group.add(leftDoor, rightDoor);

            const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.08, 0.04), lampMat);
            lamp.position.set(0, 0.83, -0.79);
            group.add(lamp);

            const button = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.28, 0.08),
                new THREE.MeshStandardMaterial({color: 0x333333, roughness: 0.7}));
            button.position.set(1.02, -0.15, -0.79);
            group.add(button);

            group.userData.leftDoor = leftDoor;
            group.userData.rightDoor = rightDoor;
            group.userData.position = new THREE.Vector3(x * BLOCK_SIZE, 0, z * BLOCK_SIZE);
            group.position.copy(group.userData.position);
            scene.add(group);
            elevators.push(group);
            return group;
        }

        function spawnElevators() {
            elevators.forEach(e => scene.remove(e));
            elevators = [];

            // Rzadziej niż światła; tylko w wolnych komórkach.
            for (let x = gridX - RENDER_RADIUS; x <= gridX + RENDER_RADIUS; x++) {
                for (let z = gridZ - RENDER_RADIUS; z <= gridZ + RENDER_RADIUS; z++) {
                    if (getCell(x, z) !== 0 || (x === 0 && z === 0)) continue;
                    if (pseudoRandom(x + 4200, z - 7300) < 0.018) {
                        createElevatorAt(x, z);
                    }
                }
            }
        }

        function nearestElevator() {
            let best = null, bestDist = Infinity;
            for (const e of elevators) {
                if (e.userData.used) continue;
                const dx = gridX - e.userData.gridX, dz = gridZ - e.userData.gridZ;
                const d = Math.abs(dx) + Math.abs(dz);
                if (d < bestDist) { best = e; bestDist = d; }
            }
            return bestDist <= 1 ? best : null;
        }

        async function useElevator(e) {
            if (!e || elevatorBusy || e.userData.used || isMoving || isRotating) return;
            elevatorBusy = true;
            e.userData.used = true;
            elevatorUsed = true;

            const left = e.userData.leftDoor;
            const right = e.userData.rightDoor;

            // Otwórz drzwi.
            left.position.x = -0.82;
            right.position.x = 0.82;
            await new Promise(r => setTimeout(r, 450));

            // Automatycznie wejdź do windy.
            const ex = e.userData.gridX, ez = e.userData.gridZ;
            gridX = ex; gridZ = ez;
            targetX = ex * BLOCK_SIZE;
            targetZ = ez * BLOCK_SIZE;
            isMoving = true;
            while (isMoving) await new Promise(r => setTimeout(r, 20));

            // Obrót o 180°.
            targetYaw = currentYaw + Math.PI;
            isRotating = true;
            while (isRotating) await new Promise(r => setTimeout(r, 20));

            // Zamknij drzwi i "przejazd".
            left.position.x = -0.43;
            right.position.x = 0.43;
            await new Promise(r => setTimeout(r, 1000));

            // Nowe piętro: deterministyczny offset świata, aby po przejeździe
            // powstał inny, ale nadal proceduralny układ.
            gridX = 10000 + Math.floor(Math.sin(Date.now()) * 5000);
            gridZ = 10000 + Math.floor(Math.cos(Date.now()) * 5000);
            targetX = 0;
            targetZ = 0;
            camera.position.x = 0;
            camera.position.z = 0;

            updateWorld();
            spawnElevators();

            await new Promise(r => setTimeout(r, 800));

            elevatorBusy = false;
        }

        function init() {
            const canvas = document.getElementById('gameCanvas');
            
            // Konfiguracja sceny i kamery
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            // Gęsta czarna mgła pochłaniająca widok na krawędziach latarki
            scene.fog = new THREE.FogExp2(0x020202, 0.08); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 0, 0); // Gracz na wysokości 0 (środek bloku)

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Ambient light - ledwie widoczny mrok
            const ambientLight = new THREE.AmbientLight(0x050505);
            scene.add(ambientLight);

            // Latarka (SpotLight) przyczepiona do kamery
            const flashlight = new THREE.SpotLight(0xfffae6, 3, 20, Math.PI / 5, 0.6, 2);
            flashlight.position.set(0, 0, 0);
            flashlight.target.position.set(0, 0, -1);
            camera.add(flashlight);
            camera.add(flashlight.target);
            scene.add(camera); // Dodajemy kamerę do sceny, by jej obiekty potomne działały poprawnie

            // Generowanie tekstur
            const wallTex = createDirtTexture('#1a1a1a', '#0a0a0a', '#2a2a2a', false);
            const floorTex = createDirtTexture('#111111', '#050505', '#1a1a1a', true);
            const ceilTex = createDirtTexture('#0d0d0d', '#000000', '#151515', true);

            // Materiały
            const wallMaterial = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9, metalness: 0.1 });
            const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 1.0 });
            const ceilMaterial = new THREE.MeshStandardMaterial({ map: ceilTex, roughness: 1.0 });

            // Geometria (Sześciany i płaszczyzny)
            const boxGeo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            const planeGeo = new THREE.PlaneGeometry(BLOCK_SIZE, BLOCK_SIZE);

            // Inicjalizacja InstancedMesh dla wydajnego renderowania dynamicznych chunków
            wallInstancedMesh = new THREE.InstancedMesh(boxGeo, wallMaterial, MAX_INSTANCES);
            
            // Plane domyślnie jest pionowy, obracamy go do poziomu
            planeGeo.rotateX(-Math.PI / 2); 
            floorInstancedMesh = new THREE.InstancedMesh(planeGeo, floorMaterial, MAX_INSTANCES);
            
            // Sufit (odwrócony)
            const ceilGeo = new THREE.PlaneGeometry(BLOCK_SIZE, BLOCK_SIZE);
            ceilGeo.rotateX(Math.PI / 2);
            ceilInstancedMesh = new THREE.InstancedMesh(ceilGeo, ceilMaterial, MAX_INSTANCES);

            scene.add(wallInstancedMesh);
            scene.add(floorInstancedMesh);
            scene.add(ceilInstancedMesh);

            addSurfaceDecorations();

            // Pula rzadkich świateł na suficie
            for (let i = 0; i < 15; i++) {
                let pLight = new THREE.PointLight(0xffa500, 1.5, 6, 2); // Pomarańczowe, słabe światło
                pLight.position.set(0, -100, 0); // Ukryte na start
                scene.add(pLight);
                ceilingLights.push(pLight);
            }

            // Pierwsze wygenerowanie chunków wokół punktu startowego
            updateWorld();

            // Ukrycie ekranu ładowania
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            }, 100);

            // Start głównej pętli
            requestAnimationFrame(animate);
        }

        function updateWorld() {
            const dummy = new THREE.Object3D();
            let wallCount = 0;
            let floorCount = 0;
            let ceilCount = 0;
            let lightIndex = 0;
            let grimeCount = 0;
            let puddleCount = 0;

            // Ukryj wszystkie światła
            ceilingLights.forEach(light => light.position.y = -100);

            // Przeskanuj siatkę wokół gracza
            for (let x = gridX - RENDER_RADIUS; x <= gridX + RENDER_RADIUS; x++) {
                for (let z = gridZ - RENDER_RADIUS; z <= gridZ + RENDER_RADIUS; z++) {
                    
                    let cellType = getCell(x, z);
                    
                    // Współrzędne w świecie 3D
                    let worldX = x * BLOCK_SIZE;
                    let worldZ = z * BLOCK_SIZE;

                    if (cellType === 1) {
                        // Ściana
                        dummy.position.set(worldX, 0, worldZ);
                        dummy.updateMatrix();
                        wallInstancedMesh.setMatrixAt(wallCount++, dummy.matrix);
                    } else {
                        // Podłoga i Sufit w wolnych polach
                        dummy.position.set(worldX, -BLOCK_SIZE/2, worldZ);
                        dummy.updateMatrix();
                        floorInstancedMesh.setMatrixAt(floorCount++, dummy.matrix);

                        dummy.position.set(worldX, BLOCK_SIZE/2, worldZ);
                        dummy.updateMatrix();
                        ceilInstancedMesh.setMatrixAt(ceilCount++, dummy.matrix);

                        // Losowe, rzadkie światła na suficie (Tylko w wolnych przestrzeniach - środkach)
                        if (mod(x, 2) !== 0 && mod(z, 2) !== 0) {
                            if (pseudoRandom(x, z + 999) < 0.08 && lightIndex < ceilingLights.length) {
                                ceilingLights[lightIndex].position.set(worldX, BLOCK_SIZE/2 - 0.1, worldZ);
                                lightIndex++;
                            }

                            // Kałuże i stare zielonkawe zabrudzenia na podłodze.
                            if (pseudoRandom(x + 3100, z - 1700) < 0.13 && puddleCount < MAX_DECOR_INSTANCES) {
                                dummy.position.set(
                                    worldX + (pseudoRandom(x, z + 300) - 0.5) * 0.5,
                                    -BLOCK_SIZE/2 + 0.012,
                                    worldZ + (pseudoRandom(x + 20, z) - 0.5) * 0.5
                                );
                                dummy.rotation.y = pseudoRandom(x + 500, z) * Math.PI;
                                dummy.scale.set(1, 1, 0.65 + pseudoRandom(x, z + 700) * 0.8);
                                dummy.updateMatrix();
                                puddleInstancedMesh.setMatrixAt(puddleCount++, dummy.matrix);
                            }

                            if (pseudoRandom(x - 2200, z + 4400) < 0.18 && grimeCount < MAX_DECOR_INSTANCES) {
                                dummy.position.set(worldX, -BLOCK_SIZE/2 + 0.02, worldZ);
                                dummy.rotation.y = pseudoRandom(x + 800, z + 900) * Math.PI;
                                dummy.scale.set(0.5 + pseudoRandom(x, z + 910) * 0.8, 1, 0.5 + pseudoRandom(x + 10, z + 920) * 0.8);
                                dummy.updateMatrix();
                                grimeInstancedMesh.setMatrixAt(grimeCount++, dummy.matrix);
                            }
                        }
                    }
                }
            }

            // Aktualizacja instancji w silniku
            wallInstancedMesh.count = wallCount;
            wallInstancedMesh.instanceMatrix.needsUpdate = true;
            
            floorInstancedMesh.count = floorCount;
            floorInstancedMesh.instanceMatrix.needsUpdate = true;
            
            ceilInstancedMesh.count = ceilCount;
            ceilInstancedMesh.instanceMatrix.needsUpdate = true;

            grimeInstancedMesh.count = grimeCount;
            grimeInstancedMesh.instanceMatrix.needsUpdate = true;
            puddleInstancedMesh.count = puddleCount;
            puddleInstancedMesh.instanceMatrix.needsUpdate = true;

            spawnElevators();
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }

            if (isMoving || isRotating) return; // Blokada podczas animacji

            if (e.key === 'ArrowLeft') {
                targetYaw = currentYaw + Math.PI / 2;
                isRotating = true;
            } 
            else if (e.key === 'ArrowRight') {
                targetYaw = currentYaw - Math.PI / 2;
                isRotating = true;
            } 
            else if (e.key === 'ArrowUp') {
                // Obliczanie kierunku ruchu na podstawie obecnego obrotu (Yaw)
                // Używamy ujemnych wartości dla Z, ponieważ -Z to domyślny przód w Three.js
                let dirX = Math.round(Math.sin(-currentYaw));
                let dirZ = Math.round(-Math.cos(-currentYaw));
                
                let nextGridX = gridX + dirX;
                let nextGridZ = gridZ + dirZ;

                // Weryfikacja kolizji (czy pole to nie ściana)
                if (getCell(nextGridX, nextGridZ) === 0) {
                    gridX = nextGridX;
                    gridZ = nextGridZ;
                    targetX = gridX * BLOCK_SIZE;
                    targetZ = gridZ * BLOCK_SIZE;
                    isMoving = true;
                    
                    // Zaktualizuj teren (chunka) od razu po wejściu na nowe pole
                    updateWorld();
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'e') {
                useElevator(nearestElevator());
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Interpolacja dla płynnego ruchu (Tweening)
            if (isMoving) {
                // LERP (Linear Interpolation) dla pozycji
                camera.position.x += (targetX - camera.position.x) * 0.15;
                camera.position.z += (targetZ - camera.position.z) * 0.15;

                // Sprawdzenie, czy dotarliśmy wystarczająco blisko celu
                let dx = Math.abs(targetX - camera.position.x);
                let dz = Math.abs(targetZ - camera.position.z);
                if (dx < 0.01 && dz < 0.01) {
                    camera.position.x = targetX;
                    camera.position.z = targetZ;
                    isMoving = false;
                }
            }

            // Interpolacja dla płynnego obrotu
            if (isRotating) {
                currentYaw += (targetYaw - currentYaw) * 0.15;
                camera.rotation.y = currentYaw;

                if (Math.abs(targetYaw - currentYaw) < 0.005) {
                    currentYaw = targetYaw;
                    camera.rotation.y = currentYaw;
                    isRotating = false;
                }
            }

            // Lekkie pływanie kamery dodające realizmu (head bobbing)
            if (!isMoving && !isRotating) {
                const time = Date.now() * 0.001;
                camera.position.y = Math.sin(time * 2) * 0.012; 
            } else if (isMoving) {
                const time = Date.now() * 0.01;
                camera.position.y = Math.abs(Math.sin(time)) * 0.035;
            }

            renderer.render(scene, camera);
        }

        // Start 
        window.onload = init;
    </script>
</body>
</html>
